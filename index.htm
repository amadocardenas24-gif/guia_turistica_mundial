<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turista Virtual - Cámara</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .overlay-ui {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 480px;
            height: 90vh;
            max-height: 750px;
            background-color: rgba(22, 22, 24, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .header-content {
            padding-top: 10px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #d1d1d6;
            margin-bottom: 20px;
            padding: 0 10px;
        }
        .btn-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10px 0;
        }
        .btn {
            background-color: #2f65f6;
            color: #ffffff;
            border: none;
            border-radius: 18px;
            width: 100%;
            height: 100%;
            min-height: 220px;
            font-size: 28px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 8px 25px rgba(47, 101, 246, 0.4);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .btn-latente {
            animation: latir 1.5s infinite;
        }
        @keyframes latir {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(47, 101, 246, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 18px rgba(47, 101, 246, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(47, 101, 246, 0); }
        }
        .footer-content {
            padding-bottom: 10px;
        }
        .btn-secondary {
            background-color: rgba(58, 58, 60, 0.9);
            font-size: 16px;
            padding: 14px 24px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body id="cuerpoApp">

    <div class="container">
        <!-- Elemento de video para la cámara en tiempo real -->
        <video id="camaraVideo" autoplay playsinline muted></video>

        <div class="overlay-ui" id="welcomeModal">
            <div class="header-content">
                <h1>Turista Virtual</h1>
                <p id="welcomeText">Presiona el botón gigante para activar el sistema, abrir la cámara, escuchar la bienvenida y conectar con el GPS.</p>
            </div>
            
            <div class="btn-container">
                <button class="btn btn-latente" id="btnIniciar" onclick="iniciarSistemaCompleto()">INICIAR SISTEMA</button>
            </div>

            <div class="footer-content">
                <button class="btn-secondary" onclick="reiniciarVariables()">Reiniciar</button>
            </div>
        </div>
    </div>

    <script>
        let posicionUsuario = null;
        let gpsConectado = false;
        let streamCamara = null;

        function iniciarSistemaCompleto() {
            const textoBienvenida = "Bienvenido al sistema interactivo de guía urbana. Activando cámara y conectando con tu ubicación exacta por GPS. Espera un instante.";
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const mensaje = new SpeechSynthesisUtterance(textoBienvenida);
                mensaje.lang = 'es-ES';
                window.speechSynthesis.speak(mensaje);
            }

            document.getElementById("welcomeText").innerText = "Activando cámara y conectando con el GPS...";
            const boton = document.getElementById("btnIniciar");
            boton.innerText = "BUSCANDO...";
            boton.classList.remove("btn-latente");

            // 1. Activar la cámara del dispositivo de forma simultánea
            activarCamara();

            // 2. Lanzar la geolocalización
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        posicionUsuario = { latitud: lat, longitud: lon };
                        gpsConectado = true;
                        
                        obtenerNombreUbicacion(lat, lon);
                    },
                    function(error) {
                        console.warn("Aviso de GPS: " + error.message);
                        gpsConectado = true;
                        marcarExitoGps("Cámara activa. No se pudo obtener la ubicación GPS exacta, pero el sistema opera con normalidad.");
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 18000,
                        maximumAge: 0
                    }
                );
            } else {
                gpsConectado = true;
                marcarExitoGps("Cámara activa. Geolocalización no soportada en este dispositivo.");
            }
        }

        // Función para encender la cámara trasera o frontal del dispositivo
        function activarCamara() {
            const constraints = {
                video: {
                    facingMode: "environment" // Prefiere la cámara trasera para apuntar al entorno
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    streamCamara = stream;
                    const videoElement = document.getElementById("camaraVideo");
                    videoElement.srcObject = stream;
                })
                .catch(function(error) {
                    console.warn("Aviso de Cámara: " + error.message);
                    // Si falla la trasera, intentamos con cualquier cámara disponible
                    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                        .then(function(stream) {
                            streamCamara = stream;
                            document.getElementById("camaraVideo").srcObject = stream;
                        })
                        .catch(function(err) {
                            console.error("Error crítico al acceder a la cámara:", err);
                        });
                });
        }

        function obtenerNombreUbicacion(lat, lon) {
            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
            
            fetch(url, { headers: { 'Accept-Language': 'es' } })
                .then(response => response.json())
                .then(data => {
                    let lugar = "ubicación desconocida";
                    if (data && data.address) {
                        const calle = data.address.road || data.address.pedestrian || data.address.suburb || "";
                        const numero = data.address.house_number ? `, número ${data.address.house_number}` : "";
                        const ciudad = data.address.city || data.address.town || data.address.village || data.address.municipality || data.address.county || "";
                        const estado = data.address.state || data.address.country || "";
                        
                        let partes = [];
                        if (calle) partes.push(`en la calle ${calle}${numero}`);
                        if (ciudad) partes.push(ciudad);
                        if (estado) partes.push(estado);
                        
                        if (partes.length > 0) {
                            lugar = partes.join(", ");
                        }
                    }
                    marcarExitoGps(`¡Cámara y GPS conectados! Tu ubicación ha sido registrada ${lugar}.`);
                })
                .catch(() => {
                    marcarExitoGps("¡Cámara y GPS conectados con éxito! Tu entorno visual y posición están activos.");
                });
        }

        function marcarExitoGps(textoExito) {
            document.getElementById("cuerpoApp").style.backgroundColor = "#8b0000";
            document.getElementById("welcomeText").innerText = textoExito;
            
            const boton = document.getElementById("btnIniciar");
            boton.innerText = "¡CONECTADO!";
            boton.style.backgroundColor = "#ff3b30";

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const mensaje = new SpeechSynthesisUtterance(textoExito);
                mensaje.lang = 'es-ES';
                window.speechSynthesis.speak(mensaje);
            }
        }

        function reiniciarVariables() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            
            // Detener las pistas de la cámara si están activas
            if (streamCamara) {
                streamCamara.getTracks().forEach(track => track.stop());
                streamCamara = null;
            }
            document.getElementById("camaraVideo").srcObject = null;

            posicionUsuario = null;
            gpsConectado = false;
            
            document.getElementById("cuerpoApp").style.backgroundColor = "#0b0b0b";
            document.getElementById("welcomeText").innerText = "Presiona el botón gigante para activar el sistema, abrir la cámara, escuchar la bienvenida y conectar con el GPS.";
            
            const boton = document.getElementById("btnIniciar");
            boton.innerText = "INICIAR SISTEMA";
            boton.style.backgroundColor = "#2f65f6";
            boton.classList.add("btn-latente");
            
            document.getElementById("welcomeModal").style.display = "flex";
        }
    </script>

</body>
</html>
